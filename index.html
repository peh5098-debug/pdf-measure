<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2457d6">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);color-scheme:light}html{background:#14171c}</style>
<title>도면 치수 측정기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen app. Top bar, full-bleed drawing stage with floating loupe / readout / nudge pad, bottom dock. */
:root{
  --bg:#dfe3e8; --chrome:#fbfbfc; --chrome-2:#eef1f4; --ink:#14181f; --muted:#5a6472; --line:#d3d9e0;
  --accent:#2457d6; --accent-ink:#ffffff; --accent-soft:#e5ecff; --warn:#b4540a; --warn-soft:#fff0e0; --dim:#c81e35;
  --sans:"IBM Plex Sans","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171c; --chrome:#1d2127; --chrome-2:#272c34; --ink:#e9ecf1; --muted:#9ba5b3; --line:#363d48;
  --accent:#86a8ff; --accent-ink:#0a1226; --accent-soft:#23325c; --warn:#ffb067; --warn-soft:#3b2a17; --dim:#ff7185; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171c; --chrome:#1d2127; --chrome-2:#272c34; --ink:#e9ecf1; --muted:#9ba5b3; --line:#363d48;
  --accent:#86a8ff; --accent-ink:#0a1226; --accent-soft:#23325c; --warn:#ffb067; --warn-soft:#3b2a17; --dim:#ff7185; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.4 var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{height:40px;min-width:40px;padding:0 12px;border:1px solid var(--line);background:var(--chrome-2);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;white-space:nowrap}
.btn:active{filter:brightness(.94)}
label.btn{cursor:pointer;user-select:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.danger{color:var(--dim)}
.btn:disabled{opacity:.4;cursor:default}
.top{display:flex;align-items:center;gap:8px;padding-block:8px;background:var(--chrome);border-bottom:1px solid var(--line)}
.fname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.fname small{color:var(--muted);font-weight:400;margin-left:6px}
.pager{display:flex;align-items:center;gap:2px;font:500 13px var(--mono)}
.pager .btn{min-width:34px;height:34px;padding:0}
.chip{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:transparent;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.chip .mono{font-family:var(--mono)}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:600 12px/20px var(--mono);text-align:center;padding:0 5px}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--bg)}
#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}
#view.pan{cursor:grab}
#loupe{position:absolute;top:10px;left:max(16px,env(safe-area-inset-left,0px));width:140px;height:140px;border:2px solid var(--ink);border-radius:12px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.3);pointer-events:none}
#loupe.right{left:auto;right:max(16px,env(safe-area-inset-right,0px))}
.hud{position:absolute;left:0;right:0;bottom:0;padding-bottom:12px;display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none}
.hud>*{pointer-events:auto}
.toast{align-self:center;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;max-width:92%;text-align:center;opacity:0;visibility:hidden;transition:opacity .2s;pointer-events:none!important}
.toast.on{opacity:1;visibility:visible}
.pad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px);gap:4px;margin-right:max(16px,env(safe-area-inset-right,0px))}
.pad button{border:1px solid var(--line);background:var(--chrome);border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.18);touch-action:none}
.pad button:active{background:var(--accent-soft)}
.pad .step{grid-area:2/2;display:flex;align-items:center;justify-content:center;font:600 11px var(--mono);color:var(--muted);background:var(--chrome);border:1px solid var(--line);border-radius:10px}
.readout{width:calc(100% - 2*max(16px,env(safe-area-inset-left,0px)));margin:0 max(16px,env(safe-area-inset-left,0px));background:var(--chrome);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.ro-main{flex:1;min-width:0}
.ro-label{font-size:12px;color:var(--muted)}
.ro-val{font:600 26px/1.15 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ro-val.hint{font:500 14px/1.4 var(--sans);white-space:normal;cursor:default}
.ro-det{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:2px;font:500 12px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.ro-det i{font-style:normal;white-space:nowrap}
.ro-det b{font-weight:500;color:var(--ink)}
.ro-btns{display:flex;gap:6px}
.dock{background:var(--chrome);border-top:1px solid var(--line);padding-block:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.toggles{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.toggles::-webkit-scrollbar{display:none}
.row{display:flex;gap:8px;align-items:stretch}
.seg{display:flex;flex:1.3;min-width:0;background:var(--chrome-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-width:0;white-space:nowrap;height:44px;border:0;background:transparent;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--chrome);color:var(--accent);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.22)}
.confirm{flex:1;height:auto;min-height:52px;font-size:16px;border-radius:12px}
.scrim{position:fixed;inset:0;background:rgba(8,12,18,.5);z-index:20}
.sheet{position:fixed;z-index:21;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,560px);max-height:80%;overflow:auto;background:var(--chrome);border-radius:16px 16px 0 0;padding-top:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.3)}
.sheet h2{margin:0 0 4px;font-size:17px;font-weight:600}
.sheet p{margin:4px 0 12px;color:var(--muted)}
.sheet h3{margin:16px 0 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fld{display:flex;gap:8px;align-items:center;margin:8px 0}
.fld input[type=number]{flex:1;min-width:0;height:48px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--chrome-2);font:600 20px var(--mono)}
.fld .pre{font:600 20px var(--mono);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.wide{width:100%;height:48px}
.mlist{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.mrow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--chrome-2)}
.mrow[aria-current="true"]{border-color:var(--dim)}
.mrow .id{width:30px;height:30px;border-radius:50%;background:var(--dim);color:#fff;font:600 13px/30px var(--mono);text-align:center}
.mrow .v{font:600 16px var(--mono);font-variant-numeric:tabular-nums}
.mrow .d{font:12px var(--mono);color:var(--muted)}
.mrow .go{border:0;background:none;text-align:left;padding:0;min-width:0}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sum{display:flex;justify-content:space-between;font:600 14px var(--mono);margin-top:6px}
#pngimg{max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
@media (max-width:520px){.seg button{flex-direction:column;gap:1px;font-size:12px;height:54px}.seg{flex:1.4}.confirm{flex:1 1 0}}
@media (min-width:760px){.seg button{height:40px}.top .fname small{display:inline}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

</head>
<body>
<header class="top gut">
  <label class="btn" id="btnOpen" for="file" tabindex="0" role="button" aria-label="파일 열기"><svg class="ic" data-ic="open"></svg><span>열기</span></label>
  <div class="fname" id="fname">예시 도면</div>
  <div class="pager" id="pager" hidden>
    <button class="btn" id="pgPrev" aria-label="이전 페이지"><svg class="ic" data-ic="left"></svg></button>
    <span id="pgNum">1/1</span>
    <button class="btn" id="pgNext" aria-label="다음 페이지"><svg class="ic" data-ic="right"></svg></button>
  </div>
  <button class="chip" id="chipScale"><svg class="ic" data-ic="ruler"></svg><span class="mono" id="scaleTxt">축척</span></button>
  <button class="btn" id="btnList" aria-label="측정 목록"><svg class="ic" data-ic="list"></svg><span class="badge" id="cnt">0</span></button>
</header>

<main id="stage">
  <canvas id="view"></canvas>
  <canvas id="loupe" hidden></canvas>
  <div class="hud">
    <div class="pad" id="pad" hidden>
      <span></span><button data-n="0,-1" aria-label="위로"><svg class="ic" data-ic="up"></svg></button><span></span>
      <button data-n="-1,0" aria-label="왼쪽"><svg class="ic" data-ic="left"></svg></button><span class="step" id="stepTxt">1px</span><button data-n="1,0" aria-label="오른쪽"><svg class="ic" data-ic="right"></svg></button>
      <span></span><button data-n="0,1" aria-label="아래로"><svg class="ic" data-ic="down"></svg></button><span></span>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="readout">
      <div class="ro-main">
        <div class="ro-label" id="roLabel">거리</div>
        <div class="ro-val" id="roVal" title="탭하면 mm / m 전환">—</div>
        <div class="ro-det" id="roDet" hidden></div>
      </div>
      <div class="ro-btns">
        <button class="btn danger" id="btnDel" aria-label="선택한 측정 삭제" title="삭제" hidden><svg class="ic" data-ic="trash"></svg></button>
        <button class="btn" id="btnReset" aria-label="선과 숫자 위치 초기화" title="위치 초기화" hidden><svg class="ic" data-ic="reset"></svg></button>
        <button class="btn" id="btnUndo" aria-label="되돌리기"><svg class="ic" data-ic="undo"></svg></button>
        <button class="btn" id="btnDone" aria-label="연속 측정 완료" hidden><svg class="ic" data-ic="check"></svg>완료</button>
      </div>
    </div>
  </div>
</main>

<footer class="dock gut">
  <div class="toggles" role="group" aria-label="측정 옵션">
    <button class="chip" id="tgOrtho" aria-pressed="false">직교</button>
    <button class="chip" id="tgSnap" aria-pressed="true">점 스냅</button>
    <button class="chip" id="tgChain" aria-pressed="false">연속 측정</button>
    <button class="chip" id="tgFine" aria-pressed="false">미세 조정</button>
    <button class="chip" id="tgLoupe" aria-pressed="true">확대경</button>
    <button class="chip" id="tgFit">전체 보기</button>
  </div>
  <div class="row">
    <div class="seg" role="group" aria-label="도구">
      <button id="tlPan" aria-pressed="false"><svg class="ic" data-ic="hand"></svg>이동·선택</button>
      <button id="tlCal" aria-pressed="false"><svg class="ic" data-ic="ruler"></svg>보정</button>
      <button id="tlMeas" aria-pressed="true"><svg class="ic" data-ic="target"></svg>측정</button>
    </div>
    <button class="btn primary confirm" id="btnPick"><svg class="ic" data-ic="plus"></svg>점 찍기</button>
  </div>
</footer>

<input type="file" id="file" accept="application/pdf,.pdf,image/*" style="position:fixed;left:-9999px;width:1px;height:1px;opacity:0" tabindex="-1">

<div class="scrim" id="scrim" hidden></div>

<section class="sheet gut" id="sheetScale" hidden aria-label="축척 설정">
  <div class="sh-head"><h2>축척 설정</h2><button class="btn" data-close aria-label="닫기"><svg class="ic" data-ic="x"></svg></button></div>
  <p id="scaleStatus">측정하려면 먼저 실제 길이를 알려주세요.</p>
  <button class="btn primary wide" id="btnCalStart"><svg class="ic" data-ic="ruler"></svg>도면의 치수선으로 보정</button>
  <p style="margin-top:8px">도면에 적힌 길이(예: 3,000 mm 그리드 간격)의 양 끝점을 찍고 길이를 입력합니다. 가장 정확한 방법입니다.</p>
  <div id="ratioBox">
    <h3>도면 축척으로 입력 (PDF)</h3>
    <div class="chips" id="ratioChips"></div>
    <div class="fld"><span class="pre">1 :</span><input type="number" id="ratioIn" inputmode="decimal" min="1" placeholder="100"><button class="btn" id="btnRatio">적용</button></div>
    <p>용지에 맞춰 축소 인쇄된 PDF는 이 방법이 맞지 않을 수 있습니다. 그럴 때는 치수선으로 보정하세요.</p>
  </div>
</section>

<section class="sheet gut" id="sheetLen" hidden aria-label="기준 길이 입력">
  <div class="sh-head"><h2>기준 길이 입력</h2><button class="btn" data-close aria-label="닫기"><svg class="ic" data-ic="x"></svg></button></div>
  <p>찍은 두 점 사이의 실제 길이를 입력하세요.</p>
  <div class="fld"><input type="number" id="lenIn" inputmode="decimal" min="0" step="any" value="3000" aria-label="실제 길이"><button class="chip" id="lenUnit" aria-pressed="false">mm</button></div>
  <button class="btn primary wide" id="btnLenOk">축척 적용</button>
</section>

<section class="sheet gut" id="sheetList" hidden aria-label="측정 목록">
  <div class="sh-head"><h2>측정 목록</h2><button class="btn" data-close aria-label="닫기"><svg class="ic" data-ic="x"></svg></button></div>
  <div class="mlist" id="mlist"></div>
  <div class="sum" id="sumRow" hidden><span>합계</span><span id="sumVal"></span></div>
  <div class="acts">
    <button class="btn" id="btnCopy"><svg class="ic" data-ic="copy"></svg>표 복사 (엑셀)</button>
    <button class="btn" id="btnCsv"><svg class="ic" data-ic="down"></svg>CSV 저장</button>
    <button class="btn" id="btnPng"><svg class="ic" data-ic="img"></svg>PNG 저장</button>
    <button class="btn danger" id="btnClear"><svg class="ic" data-ic="trash"></svg>모두 삭제</button>
  </div>
</section>

<section class="sheet gut" id="sheetImg" hidden aria-label="이미지 저장">
  <div class="sh-head"><h2>이미지 저장</h2><button class="btn" data-close aria-label="닫기"><svg class="ic" data-ic="x"></svg></button></div>
  <p>이미지를 길게 누르거나 오른쪽 클릭해서 저장하세요.</p>
  <img id="pngimg" alt="치수가 표시된 도면">
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>

<script>

const view = $('#view'), vctx = view.getContext('2d');

  left:'<path d="m15 6-6 6 6 6"/>', right:'<path d="m9 6 6 6-6 6"/>', up:'<path d="m6 15 6-6 6 6"/>', down:'<path d="m6 9 6 6 6-6"/>',

  target:'<circle cx="12" cy="12" r="7"/><path d="M12 2v6M12 16v6M2 12h6M16 12h6"/>',

const S = {
  pg: null, name:'', doc:null, page:0, pages:1,

/* ---------- sources ---------- */
async function makePdfPage(doc, i){
  const page = await doc.getPage(i + 1);

/* ---------- select & move measurements ---------- */
function segDist(px, py, a, b){
  const vx = b.x-a.x, vy = b.y-a.y, L = vx*vx + vy*vy; let t = L ? ((px-a.x)*vx + (py-a.y)*vy)/L : 0; t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (a.x + t*vx), py - (a.y + t*vy));
}
function hitTest(px, py){
  for (let i = HITS.length-1; i >= 0; i--){
    const h = HITS[i], dx = px - h.cx, dy = py - h.cy, c = Math.cos(h.a), sn = Math.sin(h.a);
    if (Math.abs(dx*c + dy*sn) <= h.w/2 + 8 && Math.abs(-dx*sn + dy*c) <= h.h/2 + 8) return { m:h.m, kind:'label', idx:h.idx };

  for (let i = S.meas.length-1; i >= 0; i--){
    const m = S.meas[i]; if (m.page !== S.page) continue; const o = m.off || { x:0, y:0 };
    for (let j = 1; j < m.pts.length; j++){
      const a = toScr({ x:m.pts[j-1].x + o.x, y:m.pts[j-1].y + o.y }), b = toScr({ x:m.pts[j].x + o.x, y:m.pts[j].y + o.y }), d = segDist(px, py, a, b);
      if (d < bd){ bd = d; best = { m, kind:'line' }; }

}
function beginSelect(p){

}

  const i = S.meas.findIndex(m => m.id === S.sel); if (i < 0) return;

    const base = S.name.replace(/\.[^.]+$/, '') || 'drawing';
    if (true){ const blob = await new Promise(r => c.toBlob(r, 'image/png')); await saveFile(base + '_dim.png', blob); }
    else { $('#pngimg').src = c.toDataURL('image/png'); openSheet('sheetImg'); }
  } catch(e){ toast('이미지를 만들지 못했습니다'); }
});
$('#btnClear').addEventListener('click', e => {
  const b = e.currentTarget;
  if (!b.dataset.arm){ b.dataset.arm = '1'; b.lastChild.textContent = '한 번 더 누르면 삭제'; setTimeout(() => { delete b.dataset.arm; b.lastChild.textContent = '모두 삭제'; }, 2500); return; }
  delete b.dataset.arm; b.lastChild.textContent = '모두 삭제'; S.meas = []; S.sel = null; S.cur = []; updateAll();
});
$('#btnList').addEventListener('click', () => openSheet('sheetList'));

/* ---------- controls ---------- */
$('#tlPan').onclick = () => setTool('pan'); $('#tlCal').onclick = () => setTool('cal'); $('#tlMeas').onclick = () => setTool('meas');
$('#tgOrtho').onclick = () => toggle('ortho'); $('#tgSnap').onclick = () => toggle('snap'); $('#tgChain').onclick = () => { toggle('chain'); if (!S.chain && S.cur.length >= 2) finishMeas(); };
$('#tgFine').onclick = () => toggle('fine'); $('#tgLoupe').onclick = () => toggle('loupe'); $('#tgFit').onclick = () => fitView();
$('#btnDel').onclick = delSel; $('#btnReset').onclick = resetSel;
$('#btnPick').onclick = confirmPoint; $('#btnUndo').onclick = undo; $('#btnDone').onclick = () => finishMeas();
$('#roVal').onclick = () => { if ($('#roVal').classList.contains('hint')) return; S.unit = S.unit === 'mm' ? 'm' : 'mm'; updateAll(); };
$('#pgPrev').onclick = () => setPage(S.page - 1); $('#pgNext').onclick = () => setPage(S.page + 1);
document.querySelectorAll('#pad button').forEach(b => {
  const [dx, dy] = b.dataset.n.split(',').map(Number); let t1 = 0, t2 = 0; const stop = () => { clearTimeout(t1); clearInterval(t2); };
  b.addEventListener('pointerdown', e => { e.preventDefault(); nudge(dx, dy, false); stop(); t1 = setTimeout(() => { t2 = setInterval(() => nudge(dx, dy, false), 55); }, 350); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => b.addEventListener(ev, stop));
});
$('#btnOpen').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); $('#file').click(); } });
$('#file').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) openFile(f); });

/* ---------- files ---------- */
async function setPage(i){
  if (S.doc){ S.pg = await makePdfPage(S.doc, i); }
  S.page = i; cancelPending(); S.ret = null; S.raw = null; S.fitS = 0; R.base = R.reg = R.lp = null; rid++;
  resize(); updateAll(); if (S.pg.kind === 'pdf') await renderBase();
}
async function openFile(f){
  try {
    toast('파일을 여는 중…', 8000);
    const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
    let doc = null, pg;
    if (isPdf){
      if (typeof pdfjsLib === 'undefined') throw new Error('PDF 엔진을 불러오지 못했습니다. 네트워크를 확인하세요.');
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      doc = await pdfjsLib.getDocument({ data:await f.arrayBuffer() }).promise; pg = await makePdfPage(doc, 0);
    } else if (f.type.startsWith('image/')){
      const url = URL.createObjectURL(f), img = new Image(); img.src = url; await img.decode(); pg = makeImgPage(img, img.naturalWidth, img.naturalHeight);
    } else throw new Error('PDF 또는 이미지 파일을 선택하세요.');
    Object.assign(S, { doc, pg, name:f.name, page:0, pages:doc ? doc.numPages : 1, scales:{}, meas:[], nextId:1, sel:null, sample:false, tool:'meas', fitS:0, deleted:[] });
    cancelPending(); S.ret = null; S.raw = null; R.base = R.reg = R.lp = null; rid++;
    resize(); updateAll(); if (doc) await renderBase();
    toast(''); $('#toast').classList.remove('on'); openSheet('sheetScale');
  } catch(e){ toast('파일을 열 수 없습니다: ' + (e.message || e), 4500); }
}

/* ---------- init ---------- */
function loadSample(){
  const c = makeSample();
  Object.assign(S, { doc:null, pg:makeImgPage(c, 1600, 1100), name:'예시 도면', page:0, pages:1, sample:true, fitS:0,
    scales:{ 0:{ mm:10, label:'1:100' } }, nextId:3, sel:1, tool:'meas',
    meas:[ { id:1, page:0, ph:1100, pts:[{x:550,y:550},{x:700,y:400}] }, { id:2, page:0, ph:1100, pts:[{x:700,y:400},{x:980,y:400}] } ] });
}
loadSample(); resize(); updateAll();
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
